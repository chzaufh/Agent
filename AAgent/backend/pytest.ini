[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=services
    --cov=routes
    --cov-report=html
    --cov-report=term-missing

asyncio_mode = auto

markers =
    asyncio: async tests
    unit: unit tests
    integration: integration tests
