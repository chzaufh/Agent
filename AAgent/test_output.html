<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI圆桌讨论 - 沉浸式智慧空�?/title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--color-bg-primary);" class="min-h-screen text-slate-100">
    
    <!-- 顶部导航�?- 玻璃态效�?-->
    <header class="glass sticky top-0 z-50 border-b backdrop-blur-xl" style="border-color: var(--border-subtle);">
        <div class="container mx-auto px-6 py-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg">
                        <span class="text-2xl">🎭</span>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gradient">AI圆桌讨论</h1>
                        <p class="text-sm" style="color: var(--color-text-muted);">Immersive AI Roundtable</p>
                    </div>
                </div>
                <button 
                    id="createDiscussionBtn" 
                    class="bg-gradient-to-r from-blue-500 via-purple-600 to-pink-600 hover:shadow-xl text-white px-6 py-3 rounded-xl font-semibold transition-all duration-300 hover:scale-105 flex items-center gap-2">
                    <span class="text-xl">�?/span>
                    <span>创建讨论</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="container mx-auto px-6 py-8">
        
        <!-- 统计面板 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 animate-fadeIn">
            <div class="card p-6 hover:shadow-glow transition-all">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-3xl">💬</span>
                    <span class="text-2xl font-bold" style="color: var(--color-status-running);">-</span>
                </div>
                <p class="text-sm" style="color: var(--color-text-muted);">总讨论数</p>
            </div>
            <div class="card p-6 hover:shadow-glow transition-all">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-3xl">�?/span>
                    <span class="text-2xl font-bold" style="color: var(--color-status-pending);">-</span>
                </div>
                <p class="text-sm" style="color: var(--color-text-muted);">进行�?/p>
            </div>
            <div class="card p-6 hover:shadow-glow transition-all">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-3xl">�?/span>
                    <span class="text-2xl font-bold" style="color: var(--color-status-completed);">-</span>
                </div>
                <p class="text-sm" style="color: var(--color-text-muted);">已完�?/p>
            </div>
            <div class="card p-6 hover:shadow-glow transition-all">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-3xl">👥</span>
                    <span class="text-2xl font-bold" style="color: var(--color-text-accent);">8</span>
                </div>
                <p class="text-sm" style="color: var(--color-text-muted);">AI专家</p>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="flex items-center justify-between mb-6 animate-fadeIn">
            <div class="flex items-center gap-4">
                <span style="color: var(--color-text-secondary);" class="font-medium">筛选：</span>
                <select id="statusFilter" class="card px-4 py-2 cursor-pointer border-0 focus:ring-2 focus:ring-blue-500 transition-all">
                    <option value="">全部状�?/option>
                    <option value="pending">�?待启�?/option>
                    <option value="running">�?进行�?/option>
                    <option value="completed">�?已完�?/option>
                </select>
            </div>
            <div class="text-sm" style="color: var(--color-text-muted);">
                <span id="discussionCount">加载�?..</span>
            </div>
        </div>

        <!-- 讨论列表 -->
        <div id="discussionList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 动态加载讨论卡�?-->
        </div>

        <!-- 空状�?-->
        <div id="emptyState" class="text-center py-20 hidden">
            <div class="w-32 h-32 mx-auto mb-6 rounded-full bg-gradient-to-br from-blue-500/20 to-purple-600/20 flex items-center justify-center">
                <span class="text-6xl">💭</span>
            </div>
            <h3 class="text-2xl font-bold mb-3" style="color: var(--color-text-secondary);">暂无讨论记录</h3>
            <p class="text-lg mb-6" style="color: var(--color-text-muted);">开启您的第一场AI圆桌讨论</p>
            <button onclick="document.getElementById('createDiscussionBtn').click()" 
                    class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-8 py-3 rounded-xl font-semibold hover:shadow-xl transition-all">
                立即创建
            </button>
        </div>

        <!-- 加载状�?-->
        <div id="loadingState" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-slate-700 border-t-blue-500 mb-4"></div>
            <p style="color: var(--color-text-muted);">正在加载讨论列表...</p>
        </div>
    </main>

    <!-- 创建讨论模态框 - UI Pro Max -->
    <div id="createModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);">
        <div class="roundtable-container max-w-3xl w-full max-h-[90vh] overflow-y-auto animate-scaleIn">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-3xl font-bold text-gradient mb-2">创建圆桌讨论</h2>
                    <p style="color: var(--color-text-muted);">邀请AI专家为您的问题展开深度讨论</p>
                </div>
                <button id="cancelBtn" class="w-10 h-10 rounded-full hover:bg-slate-700 transition-all flex items-center justify-center">
                    <span class="text-2xl">�?/span>
                </button>
            </div>
            
            <form id="createDiscussionForm" class="space-y-6">
                <!-- 讨论主题 -->
                <div>
                    <label class="block font-semibold mb-3" style="color: var(--color-text-secondary);">
                        <span class="flex items-center gap-2">
                            <span>💡</span>
                            <span>讨论主题</span>
                            <span class="text-red-400">*</span>
                        </span>
                    </label>
                    <input 
                        type="text" 
                        id="discussionTitle" 
                        required
                        maxlength="200"
                        placeholder="例如：如何设计一个高性能的微服务架构�?
                        class="w-full px-5 py-4 rounded-xl border-2 focus:border-blue-500 transition-all text-lg"
                        style="background: var(--color-bg-elevated); border-color: var(--border-subtle);">
                </div>

                <!-- 讨论描述 -->
                <div>
                    <label class="block font-semibold mb-3" style="color: var(--color-text-secondary);">
                        <span class="flex items-center gap-2">
                            <span>📝</span>
                            <span>详细描述</span>
                            <span class="text-sm font-normal" style="color: var(--color-text-muted);">(可�?</span>
                        </span>
                    </label>
                    <textarea 
                        id="discussionDescription" 
                        rows="4"
                        placeholder="提供更多背景信息，帮助AI专家更好地理解讨论背景和目标..."
                        class="w-full px-5 py-4 rounded-xl border-2 focus:border-blue-500 transition-all resize-none"
                        style="background: var(--color-bg-elevated); border-color: var(--border-subtle);"></textarea>
                </div>

                <!-- 选择专家 -->
                <div>
                    <label class="block font-semibold mb-3" style="color: var(--color-text-secondary);">
                        <span class="flex items-center gap-2">
                            <span>👥</span>
                            <span>选择专家</span>
                            <span class="text-red-400">*</span>
                        </span>
                    </label>
                    <div class="mb-3 px-4 py-3 rounded-lg" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);">
                        <p class="text-sm flex items-center justify-between">
                            <span>已选择专家�?span id="selectedCount" class="font-bold text-blue-400">0</span> / 5</span>
                            <span style="color: var(--color-text-muted);">至少选择3位，最�?�?/span>
                        </p>
                    </div>
                    <div id="expertsList" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-80 overflow-y-auto pr-2">
                        <!-- 动态加载专家选项 -->
                    </div>
                </div>

                <!-- 按钮�?-->
                <div class="flex gap-4 pt-4">
                    <button 
                        type="submit" 
                        class="flex-1 bg-gradient-to-r from-blue-500 via-purple-600 to-pink-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:shadow-2xl transition-all hover:scale-105 flex items-center justify-center gap-2">
                        <span class="text-2xl">🚀</span>
                        <span>创建并启动讨�?/span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js?v=2"></script>
    <script src="js/home.js?v=2"></script>
</body>
</html>
