<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讨论室 - AI圆桌讨论</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen text-slate-100" style="background: var(--color-bg-primary);">

    <!-- 顶部导航栏 -->
    <header class="glass sticky top-0 z-50 border-b backdrop-blur-xl" style="border-color: var(--border-subtle);">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='/'" class="text-slate-400 hover:text-white transition-colors p-2 rounded-lg hover:bg-slate-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                    </button>
                    <div>
                        <h1 class="text-xl font-bold" id="discussionTitle">讨论室</h1>
                        <p class="text-sm text-slate-400" id="discussionDescription"></p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-slate-800 text-sm">
                        <span class="text-slate-400">第</span>
                        <span id="currentRound" class="text-white font-bold mx-0.5">0</span>
                        <span class="text-slate-400">/</span>
                        <span id="totalRounds" class="text-slate-400 mx-0.5">3</span>
                        <span class="text-slate-400">轮</span>
                    </div>
                    <span id="discussionStatus" class="badge badge-pending">准备中</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 进度条 -->
    <div class="h-1 bg-slate-800">
        <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-purple-600 transition-all duration-700" style="width: 0%"></div>
    </div>

    <!-- 主体：三栏布局 -->
    <div class="flex gap-4 px-4 py-5 mx-auto" style="max-width: 1600px; min-height: calc(100vh - 100px);">

        <!-- 左栏：专家状态小窗 -->
        <aside style="width: 200px; flex-shrink: 0;">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-1">
                参与专家 <span id="speakersCount" class="text-slate-500"></span>
            </div>
            <div id="expertsCircle" class="space-y-2">
                <!-- 动态加载专家状态卡片 -->
            </div>
        </aside>

        <!-- 中栏：讨论消息 -->
        <main class="flex-1 flex flex-col min-w-0">

            <!-- 生成中指示器 -->
            <div id="generatingIndicator" class="hidden mb-3 px-4 py-2.5 rounded-xl flex items-center gap-3"
                 style="background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.25);">
                <div class="flex gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce" style="animation-delay:0s"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce" style="animation-delay:0.15s"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce" style="animation-delay:0.3s"></span>
                </div>
                <span id="generatingText" class="text-sm text-indigo-300">正在思考...</span>
            </div>

            <!-- 空状态 -->
            <div id="emptyMessages" class="flex-1 flex flex-col items-center justify-center text-center py-20">
                <span class="text-6xl mb-4">💭</span>
                <p class="text-slate-400 text-lg">讨论即将开始</p>
                <p class="text-slate-500 text-sm mt-2">专家们正在准备发言...</p>
            </div>

            <!-- 消息列表 (Transcript) -->
            <div id="messagesContainer" class="hidden flex-1 space-y-2 overflow-y-auto" style="max-height: calc(100vh - 200px);">
                <!-- 动态插入消息气泡 -->
            </div>

            <!-- 底部统计 -->
            <div class="mt-3 pt-3 flex items-center gap-5 text-xs text-slate-500 border-t" style="border-color: var(--border-subtle);">
                <span>💬 <span id="messagesTotal">0</span> 条发言</span>
                <span id="messageCountNumber" class="hidden">0</span>
            </div>
        </main>

        <!-- 右栏：实时共识与分歧 -->
        <aside style="width: 280px; flex-shrink: 0;" class="space-y-4">

            <!-- 实时共识（讨论中实时更新） -->
            <div class="rounded-xl p-4" style="background: var(--color-bg-secondary); border: 1px solid var(--border-subtle);">
                <div class="flex items-center gap-2 mb-3">
                    <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse flex-shrink-0"></span>
                    <span class="text-sm font-semibold">实时共识</span>
                </div>
                <div id="realtimeAgreements" class="space-y-1.5 mb-4 min-h-8">
                    <p class="text-xs text-slate-500 italic">讨论开始后实时提炼...</p>
                </div>

                <div class="flex items-center gap-2 mb-2">
                    <span class="w-2 h-2 rounded-full bg-orange-400 flex-shrink-0"></span>
                    <span class="text-sm font-semibold">主要分歧</span>
                </div>
                <div id="realtimeDivergences" class="space-y-1.5 min-h-8">
                    <p class="text-xs text-slate-500 italic">暂无明显分歧</p>
                </div>
            </div>

            <!-- 最终共识（讨论结束后显示） -->
            <div id="noConsensus" class="rounded-xl p-4 text-center" style="background: var(--color-bg-secondary); border: 1px solid var(--border-subtle);">
                <span class="text-3xl mb-2 block">📋</span>
                <p class="text-xs text-slate-500">讨论结束后生成最终共识</p>
            </div>

            <div id="consensusContent" class="hidden rounded-xl p-4" style="background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.08)); border: 1px solid rgba(99,102,241,0.3);">
                <div class="flex items-center gap-2 mb-3">
                    <span>🎯</span>
                    <span class="text-sm font-semibold">最终共识</span>
                </div>
                <p id="consensusSummary" class="text-sm text-slate-300 leading-relaxed mb-4"></p>
                <div class="text-xs font-semibold text-slate-400 mb-2">关键要点</div>
                <ul id="consensusPoints" class="space-y-2">
                </ul>
            </div>

        </aside>
    </div>

    <!-- 讨论完成提示 -->
    <div id="completionNotice" class="hidden fixed bottom-6 right-6 text-white px-6 py-4 rounded-xl shadow-2xl z-50"
         style="background: linear-gradient(135deg, #10b981, #059669);">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🎉</span>
            <div>
                <div class="font-bold">讨论已完成！</div>
                <div class="text-sm opacity-90">已生成最终共识</div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/discussion.js"></script>
</body>
</html>
