<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI圆桌讨论 - 智慧协作平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--color-bg-primary);" class="min-h-screen text-slate-100">
    <!-- 顶部导航栏 -->
    <header class="glass sticky top-0 z-50 border-b backdrop-blur-xl" style="border-color: var(--border-subtle);">
        <div class="container mx-auto px-6 py-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg">
                        <span class="text-2xl">🎭</span>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gradient">AI圆桌讨论</h1>
                        <p class="text-sm" style="color: var(--color-text-muted);">Immersive AI Roundtable</p>
                    </div>
                </div>
                <button
                    id="createDiscussionBtn"
                    class="bg-gradient-to-r from-blue-500 via-purple-600 to-pink-600 hover:shadow-xl text-white px-6 py-3 rounded-xl font-semibold transition-all duration-300 hover:scale-105 flex items-center gap-2">
                    <span class="text-xl">✨</span>
                    <span>创建新讨论</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-6 py-8 max-w-7xl">
        <!-- 筛选器 -->
        <div class="mb-6 flex items-center justify-between">
            <h2 class="text-2xl font-bold">讨论列表</h2>
            <div class="flex items-center gap-4">
                <select id="statusFilter" class="px-4 py-2 rounded-lg bg-slate-800 border-slate-700 text-slate-300 focus:border-blue-500 focus:outline-none">
                    <option value="">全部状态</option>
                    <option value="pending">准备中</option>
                    <option value="running">进行中</option>
                    <option value="completed">已完成</option>
                    <option value="failed">已失败</option>
                </select>
            </div>
        </div>

        <!-- 讨论列表 -->
        <div id="discussionList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 动态加载 -->
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="inline-block p-6 rounded-full bg-slate-800 mb-4">
                <span class="text-5xl">💭</span>
            </div>
            <h3 class="text-xl font-semibold mb-2">还没有讨论</h3>
            <p class="text-slate-400 mb-6">创建第一个AI圆桌讨论，让专家们开始智慧碰撞</p>
            <button onclick="document.getElementById('createDiscussionBtn').click()"
                    class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-xl transition-all">
                创建讨论
            </button>
        </div>

        <!-- 加载状态 -->
        <div id="loadingState" class="hidden text-center py-16">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-slate-700 border-t-blue-500"></div>
            <p class="mt-4 text-slate-400">加载中...</p>
        </div>

    </main>

    <!-- 创建讨论模态框 -->
    <div id="createModal" class="hidden fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto border-slate-700">
            <!-- 模态框头部 -->
            <div class="sticky top-0 bg-slate-900 border-b border-slate-700 p-6 flex items-center justify-between">
                <h2 class="text-2xl font-bold">创建新讨论</h2>
                <button id="cancelBtn" class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- 模态框内容 -->
            <form id="createDiscussionForm" class="p-6 space-y-6">
                <!-- 讨论信息 -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">讨论主题 *</label>
                        <input
                            type="text"
                            id="discussionTitle"
                            required
                            placeholder="例如：如何设计一个爆款小游戏？"
                            class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">详细描述（可选）</label>
                <textarea
                            id="discussionDescription"
                            rows="3"
                            placeholder="补充说明讨论的背景和目标..."
                            class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none resize-none"></textarea>
                    </div>
                </div>

                <!-- 选择专家 -->
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <label class="block text-sm font-semibold">选择参与专家（3-5位）*</label>
                        <span class="text-sm text-slate-400">
                            已选择 <span id="selectedCount" class="text-blue-400 font-bold">0</span> 位
                        </span>
                    </div>
                    <div id="expertsList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <!-- 动态加载专家选项 -->
                    </div>
                </div>

                <!-- 提交按钮 -->
                <div class="flex items-center justify-end gap-4 pt-4 border-t border-slate-700">
                    <button
                        type="button"
                        id="cancelBtn2"
                        class="px-6 py-3 rounded-xl bg-slate-800 text-white font-semibold hover:bg-slate-700 transition-colors">
                        取消
                    </button>
                    <button
                        type="submit"
                        class="px-6 py-3 rounded-xl bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold hover:shadow-xl transition-all">
                        创建并启动讨论
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 引入工具函数 -->
    <script src="js/utils.js"></script>
    <!-- 引入API模块 -->
    <script src="js/api.js"></script>
    <!-- 引入首页逻辑 -->
    <script src="js/home.js"></script>

    <script>
        // 第二个取消按钮
        document.getElementById('cancelBtn2').addEventListener('click', () => {
            document.getElementById('createModal').classList.add('hidden');
            document.getElementById('createDiscussionForm').reset();
        });
    </script>

</body>
</html>
